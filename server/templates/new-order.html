<h1 style="margin:0 0 16px;font-size:20px;font-weight:700;">You have a new order</h1>
<p style="margin:0 0 16px;">Hi {{name}}, a buyer has funded an escrow for your listing. The money is locked safely — ship the item, mark it delivered, and your payout releases on the buyer's confirmation.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 20px;font-size:14px;">
  <tr><td style="padding:4px 16px 4px 0;color:#8a8f98;">Item</td><td style="padding:4px 0;">{{title}}</td></tr>
  <tr><td style="padding:4px 16px 4px 0;color:#8a8f98;">Amount</td><td style="padding:4px 0;font-weight:600;">GH₵ {{amount}}</td></tr>
  <tr><td style="padding:4px 16px 4px 0;color:#8a8f98;">Deal code</td><td style="padding:4px 0;">{{code}}</td></tr>
</table>
<p style="margin:0 0 24px;">
  <a href="{{webOrigin}}/deals" style="display:inline-block;background:#0052ff;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:600;">View the deal</a>
</p>
